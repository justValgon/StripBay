name: Fehler melden
description: Etwas funktioniert nicht wie erwartet
labels: ["bug"]
body:
  - type: input
    id: version
    attributes:
      label: StripBay-Version
      placeholder: "4.1.0"
    validations:
      required: true
  - type: dropdown
    id: profil
    attributes:
      label: Profil
      options: [EDDB, EDDP, EDDV, Remote-Gerät, egal]
    validations:
      required: true
  - type: dropdown
    id: rolle
    attributes:
      label: Deine Station
      options: [DEL, APN, GND, TWR, Mehrere, Sonstige]
  - type: textarea
    id: was
    attributes:
      label: Was ist passiert, und was hast du erwartet?
    validations:
      required: true
  - type: textarea
    id: schritte
    attributes:
      label: Schritte zum Nachstellen
  - type: textarea
    id: extra
    attributes:
      label: Screenshots, Meldungen im EuroScope-Fenster, andere Plugins (TopSky, GRP, vACDM)
